version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: minivoxsetu_backend
    ports:
      - "8000:8000"
    environment:
      # These will be read from the host environment or a .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VECTOR_DB_MODE=qdrant
      - QDRANT_URL=http://qdrant:6333
      # Optimization for 12GB+ RAM instances
      - ACOUSTIC_MIN_RAM_GB=1.5
      - ACOUSTIC_NUM_THREADS=4
    volumes:
      - ./backend/knowledge:/app/knowledge
      - ./backend/reports:/app/reports
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: minivoxsetu_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
